[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "book-publisher-trends-7-models"
version = "0.1.0"
description = "End-to-end monthly book publishing time-series forecasting"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3"]

[project.optional-dependencies]
models = [
    "xgboost>=2.0",
    "prophet>=1.1.5",
    "statsmodels>=0.14",
    "keras>=3.5,<4",
    "jax[cpu]>=0.4,<0.6",
]
app = ["streamlit>=1.45", "plotly>=5.18"]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
